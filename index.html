<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DCX Giveaway</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#050814;color:#fff}
.box{max-width:440px;margin:auto;padding:15px}
.card{background:#12172a;border:1px solid #222;border-radius:16px;padding:16px;margin:12px 0}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;margin:5px 0;display:block;text-align:center;text-decoration:none}
.btn-green{background:#00ff88;color:#000}
.btn-wa{background:#25D366;color:#fff}
.btn-locked{background:#222!important;color:#555!important;pointer-events:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small{font-size:11px;opacity:0.5}
</style>
</head>
<body>
<div class="box">
<h1 style="text-align:center">DCX MEGA GIVEAWAY</h1>
<p style="text-align:center" class="small">Earn $0.05 per Ad = $0.15/day | 1000 DCX = $1.00<br>Pool: $50-200 USDT + 1M DCX</p>

<div class="card" style="text-align:center">
<b>Partners</b><br>
<img src="partners.png" style="width:100%;border-radius:10px;margin-top:8px">
</div>

<div class="card" style="border:2px solid #25D366">
<b>Share to 20 WhatsApp to Unlock Earn Site</b>
<div class="grid" id="waGrid"></div>
<div style="background:#111;height:10px;border-radius:10px;margin:10px 0"><div id="pbar" style="height:10px;background:#25D366;width:0%;border-radius:10px"></div></div>
<div id="pcount" style="text-align:center;font-weight:bold">0 / 20</div>
</div>

<div class="card" style="text-align:center">
<div id="lock">🔒 Locked - Do 20 shares first</div>
<a id="earnBtn" class="btn btn-locked" href="#">Start Earning → 🔒 0/20</a>
</div>
</div>

<script>
let shares=parseInt(localStorage.getItem('wa_shares')||'0');
function update(){
document.getElementById('pcount').innerText=shares+' / 20';
document.getElementById('pbar').style.width=(shares/20*100)+'%';
let btn=document.getElementById('earnBtn');
btn.innerText=shares>=20?'Start Earning $0.15/day →':'Start Earning → 🔒 '+shares+'/20';
if(shares>=20){btn.className='btn btn-green';btn.href='https://dco-lhpp.onrender.com';document.getElementById('lock').style.display='none';}
}
function share(i){
// NO POPUP AD - DIRECT WHATSAPP LINK
let text="🚀 DCX Giveaway! Earn $0.15/day + $200 Pool. Join: https://dco-lhpp.onrender.com";
let url="https://api.whatsapp.com/send?text="+encodeURIComponent(text);
// use location.href not window.open to avoid popunder
window.location.href=url;
// we count after 2 seconds when user returns
setTimeout(()=>{if(!localStorage.getItem('wa_done_'+i)){localStorage.setItem('wa_done_'+i,'1');shares++;localStorage.setItem('wa_shares',shares);update();}},2000);
}
let grid=document.getElementById('waGrid');
for(let i=1;i<=20;i++){
let b=document.createElement('button');b.className='btn btn-wa';b.id='wa'+i;b.innerText='WhatsApp '+i;
if(localStorage.getItem('wa_done_'+i)){b.style.opacity='0.4';b.innerText='✓ Shared '+i;}
b.onclick=()=>share(i);grid.appendChild(b);
}
update();
</script>
<!-- ABSOLUTELY NO ADSTERRA SCRIPT HERE -->
</body>
</html>
